- hosts: web
  gather_facts: true
  tasks:
    - name: Get processes
      ansible.builtin.command: pgrep -c apache2
      register: nproc
      when: command == "list"
    - name: Print number of apache processes
      ansible.builtin.debug:
        msg: "Running apache processes: {{ nproc.stdout }}"
      when: command == "list"
    - name: Restart web server
      command:
        cmd: "{{ ansible_env.HOME }}/restart_webserver.sh"
      when: command == "start"
  # No need to stop Apache
  tags: web

