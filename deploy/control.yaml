---
- hosts: localhost
  gather_facts: false
  tasks:
    - name: check command
      any_errors_fatal: true
      ansible.builtin.fail:
        msg: command must be either start or stop
      when: (command is not defined) or
            (command != "start" and command != "stop" and command != "list")
  tags: always

#- hosts: all
#  gather_facts: true

# standalone database node
- hosts: db
  gather_facts: false
  become: true
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
      when: command == "list"
    - name: Print service state
      ansible.builtin.debug:
        var: ansible_facts.services['mariadb.service']['state']
      when: command == "list"
    - name: Start MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
      when: command == "start"
    - name: Stop MariaDB
      ansible.builtin.service:
        name: mariadb
        state: stopped
      when: command == "stop"
  tags: db

# galera cluster
- hosts: cluster_control
  gather_facts: false
  become: true
  tasks:
    - name: Get cluster state
      ansible.builtin.command: s9s node --list --long
      register: cluster_state
      when: command == "list"
    - name: Print cluster state
      ansible.builtin.debug:
        var: cluster_state.stdout_lines 
      when: command == "list"
    - name: Start Galera cluster
      ansible.builtin.command: s9s cluster --start --cluster-id=1
      when: command == "start"
    - name: Stop Galera cluster
      ansible.builtin.command: s9s cluster --stop --cluster-id=1
      when: command == "stop"
  tags: db

