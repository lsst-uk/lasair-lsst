# service node - prometheus & grafana
- hosts: svc
  gather_facts: false
  become: true
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
      when: command == "list"
    - name: Print service state
      ansible.builtin.debug:
        var: ansible_facts.services['prometheus.service']['state']
      when: command == "list"
    - name: Print service state
      ansible.builtin.debug:
        var: ansible_facts.services['grafana-server.service']['state']
      when: command == "list"
    - name: Start Prometheus
      ansible.builtin.service:
        name: prometheus
        state: started
      when: command == "start"
    - name: Start Grafana
      ansible.builtin.service:
        name: grafana-server
        state: started
      when: command == "start"
    - name: Stop Grafana
      ansible.builtin.service:
        name: grafana-server
        state: stopped
      when: command == "stop"
    - name: Stop Prometheus
      ansible.builtin.service:
        name: prometheus
        state: stopped
      when: command == "stop"
  tags: monitor

# kafkas node - zookeeper and kafka
- hosts: kafka
  gather_facts: false
  become: true
  tasks:
    - name: Populate zookeeper container info
      community.docker.docker_container_info:
        name: zookeeper_zookeep_1
      register: zk_info
      when: command == "list"
    - name: Populate kafka container info
      community.docker.docker_container_info:
        name: ubuntu_kafka_1
      register: kafka_info
      when: command == "list"
    - name: Print container state
      ansible.builtin.debug:
        msg:
          - "zookeeper: {{ zk_info.container['State']['Status']}}"
          - "kafka: {{ kafka_info.container['State']['Status']}}"
      when: command == "list"
    - name: Start Zookeeper
      community.docker.docker_compose:
        project_name: zookeeper
        project_src: '.'
        files:
          - zookeeper-compose.yml
        services:
          - zookeep
        state: present
        stopped: false
      when: command == "start"
    - name: Start Kafka
      community.docker.docker_compose:
        project_src: '.'
        files:
          - kafka-compose.yml
        services:
          - kafka
        state: present
        stopped: false
      when: command == "start"
    - name: Stop Kafka
      community.docker.docker_compose:
        project_src: '.'
        files:
          - kafka-compose.yml
        services:
          - kafka
        state: present
        stopped: true
      when: command == "stop"
    - name: Stop Zookeeper
      community.docker.docker_compose:
        project_name: zookeeper
        project_src: '.'
        files:
          - zookeeper-compose.yml
        services:
          - zookeep
        state: present
        stopped: true
      when: command == "stop"
  tags: kafka

