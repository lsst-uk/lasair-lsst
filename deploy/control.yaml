- name: Cassandra seed nodes
  hosts: "cassandranodes[0]{% if 'cassandranodes' in groups and groups['cassandranodes'] | length > 3 %} :cassandranodes[2] {% endif %}" 
  gather_facts: false
  become: true
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
      when: command == "list"
    - name: Print service state
      ansible.builtin.debug:
        var: ansible_facts.services['cassandra.service']['state']
      when: command == "list"
    - name: Start Cassandra seeds
      ansible.builtin.service:
        name: cassandra
        state: started 
      when: command == "start"
    - name: Wait for seed nodes
      ansible.builtin.wait_for:
        port: 9042
        timeout: 60
      when: command == "start"
  tags: cassandra

